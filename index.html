<script>
(function () {
  "use strict";
  var de = document.documentElement;
  var st = de.style;
  var lastErr = "";
  var t0 = Date.now();

  /* ---------- Высота окна ----------
     Высоту окна больше не считает JavaScript. Раньше она бралась из innerHeight/clientHeight и
     перезаписывалась по таймерам и событиям (на iPhone эти значения при запуске и возврате в
     приложение отличаются от реальной видимой области) — из-за этого нижний край интерфейса, а с ним
     и строка ввода, сначала вставали в одно место, а потом «прыгали» в другое. Теперь приложение
     прижато к видимой области одним CSS-правилом (position:fixed; top:0; bottom:0): нижнюю границу
     всегда определяет сам браузер — при смене адресной панели, поворота, клавиатуры (Android),
     возврата из фона и любых новых размерах экрана, без пересчётов. */

  /* ---------- Тёмная тема на заставке ---------- */
  try {
    var raw = window.localStorage && window.localStorage.getItem("synra_state_v1");
    if (raw && /"theme"\s*:\s*"dark"/.test(raw)) {
      de.className += " boot-dark";
    }
  } catch (_) {}

  /* ---------- Если приложение не запустилось — показываем причину, а не пустоту ---------- */
  function note(msg) {
    msg = String(msg || "").slice(0, 240);
    if (msg && !/ResizeObserver/i.test(msg)) lastErr = msg;
  }
  window.addEventListener("error", function (e) {
    try {
      if (e && e.target && e.target !== window && e.target.tagName) return;
      note((e && e.message) + (e && e.lineno ? " (стр. " + e.lineno + ")" : ""));
    } catch (_) {}
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    try { var r = e && e.reason; note((r && r.message) || r); } catch (_) {}
  });
  function mounted() { return !!document.querySelector(".shell"); }
  function showFail() {
    var r = document.getElementById("root");
    if (!r || mounted()) return;
    var d = lastErr ? '<div style="font-size:12px;color:#5F6368;max-width:320px;word-break:break-word;">' + lastErr.replace(/[<>&]/g, "") + "</div>" : "";
    r.innerHTML =
      '<div id="boot-splash"><div class="bs-title">Не удалось запустить Synra</div>' +
      '<div class="bs-sub">Закройте и откройте файл ещё раз. Если повторится — сделайте скриншот этого экрана.</div>' + d +
      '<button class="bs-btn" onclick="location.reload()">Повторить</button></div>';
